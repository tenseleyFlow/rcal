[package]
name = "rcal"
version = "0.3.1"
edition = "2024"
authors = ["Matthew Forrester Wolffe"]
description = "A responsive terminal calendar with local events, reminders, and Microsoft Graph sync"
license = "GPL-3.0-only"
repository = "https://github.com/tenseleyFlow/rcal"
readme = "README.md"
keywords = ["calendar", "tui", "terminal", "microsoft-graph"]
categories = ["command-line-utilities", "date-and-time"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
fs2 = "0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
notify-rust = "4"
ratatui = "0.30.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
time = { version = "0.3.47", features = ["local-offset", "parsing"] }
toml = "0.9.8"
