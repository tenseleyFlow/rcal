[package]
name = "rcal"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
fs2 = "0.4.3"
notify-rust = "4"
ratatui = "0.30.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.47", features = ["local-offset", "parsing"] }
toml = "0.9.8"
